name: Validate website

on:
  push:
    branches:
      - main
      - agent/**
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PAYLOAD_SECRET: ci-only-payload-secret-with-sufficient-length
      SITE_URL: http://localhost:3000
      RESEND_API_KEY: ""
      TURNSTILE_SITE_KEY: ""
      TURNSTILE_SECRET_KEY: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate Payload types
        run: npm run generate:types

      - name: Validate CV Creator scripts
        run: |
          for file in public/tools/cv-creator/*.js; do
            node --check "$file"
          done

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: External CV compiler smoke test
        run: npm run test:cv-external

      - name: Upload CV spacing artifact
        uses: actions/upload-artifact@v4
        with:
          name: cv-spacing-smoke
          path: artifacts/cv-spacing-smoke.*
          if-no-files-found: error
          retention-days: 7

      - name: Cloudflare production bundle
        run: npx opennextjs-cloudflare build
