name: Validate website

on:
  push:
    branches:
      - main
      - agent/**
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PAYLOAD_SECRET: ci-only-payload-secret-with-sufficient-length
      DATABASE_URI: file:./data/ci.db
      SITE_URL: http://localhost:3000
      RESEND_API_KEY: ""
      TURNSTILE_SITE_KEY: ""
      TURNSTILE_SECRET_KEY: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Prepare test database
        run: mkdir -p data

      - name: Apply Payload migrations
        run: npm run migrate

      - name: Sync canonical content
        run: npm run content:sync

      - name: Generate Payload types
        run: npm run generate:types

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build
